# Copied to /opt/app on the server by bin/deploy. Variables come from /opt/app/.env.
name: sea-hackathon

services:
  app:
    image: ${IMAGE:?IMAGE is set by bin/deploy}
    env_file: [app.env]
    environment:
      PORT: ${APP_PORT:-8080}
    expose:
      - "${APP_PORT:-8080}"
    restart: unless-stopped

  cloudflared:
    profiles: [tunnel]
    # cloudflare/cloudflared:latest as of 2026-11-21
    image: cloudflare/cloudflared@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    command: tunnel --no-autoupdate run
    env_file: [tunnel.env]
    depends_on: [app]
    restart: unless-stopped

  caddy:
    profiles: [public]
    # caddy:2-alpine as of 2026-11-21
    image: caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      - "80:80"
      - "443:443"
    environment:
      FQDN: ${FQDN:?FQDN is set by bin/deploy}
      APP_PORT: ${APP_PORT:-8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
