server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8080;
        proxy_pass $api;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
