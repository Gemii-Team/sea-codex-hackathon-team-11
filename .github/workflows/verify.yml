name: Verify
on: [push, pull_request]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make check
  infrastructure:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aws, tencent]
    defaults:
      run:
        working-directory: infra/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check
      - run: tofu init -backend=false -input=false
      - run: tofu validate
