name: CI/CD
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - run: make check
      - name: Smoke test the container stack
        run: |
          docker compose up --build -d frontend
          curl --fail --silent --show-error --retry 12 --retry-all-errors --max-time 5 http://127.0.0.1:5173/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --max-time 5 http://127.0.0.1:5173/api/v1/status |
            jq -e '.available == true'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/hosting
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check
      - run: tofu init -backend=false -input=false
      - run: tofu validate
      - run: tofu test

  deploy:
    if: >-
      vars.ENABLE_HOSTING_CD == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [application, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: hosting-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Publish ARM64 images and deploy through SSM
        env:
          ENV_FILE: /dev/null
          HOSTING_OUTPUTS_JSON: ${{ vars.HOSTING_OUTPUTS_JSON }}
        run: |
          export HOSTING_OUTPUTS_FILE="$RUNNER_TEMP/hosting-outputs.json"
          jq -e 'select(.app_port == 8080)' <<< "$HOSTING_OUTPUTS_JSON" > "$HOSTING_OUTPUTS_FILE"
          export DEPLOY_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          infra/hosting/bin/deploy frontend --stack
