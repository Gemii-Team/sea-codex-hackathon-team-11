services:
  api:
    build:
      context: .
      args:
        SERVICE: api
    environment:
      API_ADDR: ":8080"
      MONITOR_URL: http://monitor:8081
  monitor:
    build:
      context: .
      args:
        SERVICE: monitor
    environment:
      MONITOR_ADDR: ":8081"
      API_HEALTH_URL: http://api:8080/healthz
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - api
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
volumes:
  prometheus-data:
