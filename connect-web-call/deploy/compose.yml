# Connect web-call PoC. connect-web-call/deploy/deploy sends this file to /opt/connect-web-call on
# the existing server through SSM; remote-deploy.sh starts it. It is never part of the main app's
# stack (project sea-hackathon in /opt/app), so a main rollout cannot stop it and it cannot
# replace `app`.
#
# - The service is named connect-web-call itself, never `app`: a second service called `app`
#   would register the same Docker DNS name on the shared bridge even under another alias.
# - Only IMAGE is interpolated, from .env, and it is not secret. The five PoC parameters from SSM
#   are written by remote-deploy.sh to poc.env (mode 0600, root) and read as format: raw, so no
#   value is interpolated, unquoted or expanded. Never reference a PoC parameter with dollar
#   syntax here, and never run `docker compose config` on the host without --services: it prints
#   env_file values.
# - No ports are published. cloudflared on the shared network reaches connect-web-call:8080.
name: sea-connect-web-call

services:
  connect-web-call:
    image: ${IMAGE:?IMAGE is set by remote-deploy.sh}
    env_file:
      - path: poc.env
        required: true
        format: raw
    environment:
      NODE_ENV: production
      PORT: "8080"
      PUBLIC_ORIGIN: https://call-sea-hackathon.voidbox.io
    expose:
      - "8080"
    networks: [edge]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    # Dependency-free readiness check: Node itself, against the unauthenticated /healthz.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz', { signal: AbortSignal.timeout(2000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edge:
    external: true
    name: sea-hackathon_default
